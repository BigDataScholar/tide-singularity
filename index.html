<body>
<section id="tide-singularity">
  <style>
    #tide-singularity {
      --tide-ink: color-mix(in srgb, var(--foreground, #f2e9df) 12%, #f7ebdf);
      position: relative;
      isolation: isolate;
      overflow: hidden;
      height: 100vh;
      height: 100dvh;
      color: var(--tide-ink);
      background: #090713;
      font-family: "SFMono-Regular", Consolas, monospace;
    }
    #tide-singularity canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      cursor: grab;
    }
    #tide-singularity canvas:active { cursor: grabbing; }
    #tide-singularity .tide-mast {
      position: absolute;
      top: 30px;
      left: clamp(20px, 4.1vw, 48px);
      display: grid;
      gap: 9px;
      font-size: 11px;
      letter-spacing: .2em;
      pointer-events: none;
    }
    #tide-singularity .tide-mast span:first-child {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #tide-singularity .tide-mast span:first-child::before {
      content: "";
      width: 7px;
      height: 7px;
      border: 1px solid #eeb890;
      border-radius: 50%;
      background: #eeb890;
      box-shadow: 0 0 14px #ff9d73;
    }
    #tide-singularity .tide-mast span:last-child { opacity: .65; }
    #tide-singularity .tide-footer {
      position: absolute;
      inset: auto clamp(20px, 4.1vw, 48px) 29px;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px 24px;
      pointer-events: none;
    }
    #tide-singularity .tide-name {
      display: grid;
      gap: 12px;
      text-shadow: 0 2px 30px #080510;
    }
    #tide-singularity h1 {
      margin: 0;
      color: inherit;
      font-family: "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", SimSun, serif;
      font-weight: 400;
      font-size: clamp(34px, 5.15vw, 60px);
      line-height: 1;
      letter-spacing: .12em;
    }
    #tide-singularity .tide-sub {
      color: #e6bca8;
      font-size: 11px;
      letter-spacing: .31em;
    }
    #tide-singularity .tide-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 13px;
      font-size: 11px;
      letter-spacing: .075em;
      white-space: nowrap;
    }
    #tide-singularity .tide-controls button {
      pointer-events: auto;
      color: inherit;
    }
    #tide-singularity .tide-controls [data-tide-action="pulse"] {
      padding-inline: 0;
    }
    #tide-singularity .tide-zoom {
      display: inline-flex;
      align-items: center;

    #tide-singularity .tide-message {
      display: none;
      position: absolute;
      inset: 30% 20px auto;
      text-align: center;
      font-size: 13px;
      line-height: 1.7;
    }

      content: " / 2D";
    }
    @media (max-width: 480px) {
      #tide-singularity .tide-mast { top: 22px; }
      #tide-singularity .tide-footer { bottom: 18px; }
      #tide-singularity .tide-controls { flex-basis: 100%; gap: 10px; }

  <canvas tabindex="0" aria-label="潮汐奇点。拖动或按方向键环绕，双指捏合、滚轮或加减键缩放，按住或按空格引发引力扰动。">黑洞与吸积盘的互动影像</canvas>

<script>
(() => {
const screenVertex = `#version 300 es
void main() {
  vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

const sceneFragment = `#version 300 es
precision highp float;
uniform vec2 uResolution, uShift;
uniform vec3 uEye, uForward, uRight, uUp;
uniform float uFocal, uTime, uPulse, uPress, uStorage;
uniform vec2 uDepth;
out vec4 color;

float hash(vec2 p) {
  vec3 q = fract(vec3(p.xyx) * 0.1031);
  q += dot(q, q.yzx + 33.33);
  return fract((q.x + q.y) * q.z);
}

float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1,0)), f.x),
             mix(hash(i + vec2(0,1)), hash(i + vec2(1,1)), f.x), f.y);
}

float clouds(vec2 p) {
  mat2 twist = mat2(.8, -.6, .6, .8);
  float v = .54 * noise(p);
  p = twist * p * 2.05 + 7.3;
  v += .25 * noise(p);
  p = twist * p * 2.11 + 9.4;
  v += .13 * noise(p);
  p = twist * p * 2.02;
  v += .06 * noise(p);
  return v;
}

vec3 stars(vec2 p, float freq, float size, float threshold, float seed) {
  p = p * freq;
  vec2 i = floor(p);
  float id = hash(i + seed);
  vec2 center = .16 + .68 * vec2(hash(i + 15.6 + seed), hash(i + 73.2 - seed));
  vec2 d = fract(p) - center;
  d.x *= .84;
  float r2 = dot(d,d);
  float star = exp(-r2 / (size*size)) * smoothstep(threshold, 1.0, id);
  vec3 tint = mix(vec3(1.0,.56,.34), vec3(.46,.65,1.0), hash(i - 3.7));
  return star * tint;
}

vec3 sky(vec3 d) {
  vec2 uv = vec2(atan(d.x, -d.z), asin(clamp(d.y,-1.0,1.0)));
  vec2 p = vec2(uv.x + .45 * uv.y, uv.y - .38 * uv.x);
  float drift = clouds(p * 3.8 + vec2(7.0, 2.0));
  float drift2 = clouds(p * 4.6 - 9.0);
  vec2 warp = p * 5.0 + 1.65 * vec2(drift,drift2);
  float body = clouds(warp);
  float lace = clouds(warp * 2.2 - vec2(9.0, 4.0));
  float lane = exp(-abs(p.y + .22 - .33 * drift) * 2.4);
  float veil = lane * pow(max(body - .24, 0.0) * 1.68, 2.6);
  float ridge = pow(max(lace - .37, 0.0) * 1.65, 2.9) * veil;
  vec3 c = vec3(.0018, .0016, .0042);
  c += veil * mix(vec3(.024,.017,.065),vec3(.071,.022,.048), drift);
  c += ridge * vec3(.09,.061,.18);
  c += lane * .004 * vec3(.68,.35,1.0);
  c += stars(uv, 136.0, .066, .48, 2.0) * .18;
  c += stars(uv, 61.0, .045, .80, 7.0) * .52;
  c += stars(uv, 19.0, .019, .83, 19.0) * 2.1;
  vec2 tile = uv * 12.0 + 2.5;
  vec2 cell = floor(tile);
  float big = step(.966, hash(cell + 12.4));
  vec2 s = abs(fract(tile) - (.21 + .58 * vec2(hash(cell + 6.2),hash(cell - 3.6))));
  float crossGlow = exp(-s.x*360.0-s.y*48.0) + exp(-s.y*370.0-s.x*37.0);
  c += big * (crossGlow * .45 + exp(-dot(s,s)*2300.0)*.5) * vec3(.85,.68,1.1);
  return c;
}

void disk(vec3 p, vec3 dir, float dt, inout vec3 light, inout float transmit) {
  float r = length(p.xz);
  if (r < 1.06 || r > 5.0) return;
  float a = atan(p.z,p.x);
  float orbit = a - uTime * .29 * pow(1.9 / r, 1.32);
  vec2 advected = r * vec2(cos(orbit), sin(orbit));
  float crest = 1.18 - 3.2*log(max(uPulse,.018));
  float ripple = uPulse * exp(-abs(r - crest)*1.55);
  float sheet = (.049 + .036 * smoothstep(1.5,4.5,r)) * sin(3.0*a + r*2.1);
  sheet += .31*ripple*cos((r-crest)*7.8 - .53*sin(3.0*a));
  sheet += uPress*.06*sin(a*5.0-r*3.0+uTime*3.6);
  float h = abs(p.y - sheet);
  float thick = .058 + r * .023 + ripple * .077;
  if (h > thick*4.2) return;

  float broad = noise(advected * 2.4);
  float grainNoise = noise(advected * 5.7 + vec2(9.0,3.0));
  float spiral = orbit * 3.0 + 7.5 * log(r);
  float swirls = noise(advected*3.6 + vec2(2.4,6.0)*broad);
  float crease = r + .093*sin(spiral) + .083*broad + .035*swirls + .024*grainNoise;
  float fiber = pow(.5+.5*sin(52.0*crease + 1.8*sin(spiral*2.0) + 2.5*swirls), 4.0);
  float wisps = pow(.5+.5*sin(118.0*crease - 3.7*broad + 2.9*grainNoise), 7.0);
  float rivers = .26 + .74 * pow(.5 + .5*sin(spiral + 3.1*broad), 1.65);
  float inner = smoothstep(1.06,1.29,r);
  float outer = 1.0 - smoothstep(3.15,4.86,r+.44*(grainNoise-.5));
  float falloff = exp(-.61*(r-1.28));
  float dense = exp(-h*h/(thick*thick)) * inner * outer * falloff;
  float coreLine = (r-1.34-.032*sin(3.0*a + 1.2)) / .137;
  float band = exp(-coreLine*coreLine);
  float collision = pow(max(0.0, sin(spiral+grainNoise*3.0)), 6.0) * .54;
  float excitation = (.41 + fiber*1.04 + wisps*.45) * rivers * (.22 + 1.5*broad) + band*1.62 + collision;
  float hot = exp(-.76*pow(max(0.0,r-1.21),1.43));
  vec3 ember = mix(mix(vec3(.095,.15,.40),vec3(.28,.084,.46),swirls), vec3(1.22,.29,.079), smoothstep(.04,.65,hot));
  vec3 chroma = mix(ember,vec3(1.85,1.00,.53), clamp(band*.72 + fiber*hot*.49,0.0,1.0));
  vec3 vel = normalize(vec3(-p.z, 0.0, p.x));
  float shift = .68 + .42 * dot(vel, -dir);
  float boost = .52 + 1.75 * shift * shift;
  float optical = dense * (.44 + .28*broad + .19*fiber);
  light += transmit * dense * excitation * boost * chroma * dt * (2.5 + uPress*.65 + ripple*.6);
  transmit *= exp(-optical * dt * 2.1);
}

void main() {
  vec2 screen = gl_FragCoord.xy / uResolution * 2.0 - 1.0;
  screen.x *= uResolution.x / uResolution.y;
  screen -= uShift;
  vec3 ray = normalize(uForward * uFocal + screen.x*uRight + screen.y*uUp);
  vec3 firstRay = ray;
  float closest = -dot(uEye, ray);
  float impact = max(0.0,dot(uEye,uEye)-closest*closest);
  vec3 accum = vec3(0.0);
  float transmit = 1.0;
  float captured = 0.0;
  gl_FragDepth = 1.0;
  float bend = .73 + .093*uPress + .033*uPulse;

  if (impact < 30.25 && closest > 0.0) {
    float begin = max(0.0,closest-sqrt(30.25-impact));
    vec3 p = uEye + ray*begin;
    for (int i=0; i<91; i++) {
      float r2 = dot(p,p), r = sqrt(r2);
      if (r < .745) {
        captured = 1.0;
        float depth = max(.1,closest - sqrt(max(0.0,1.79-impact))) * dot(firstRay,uForward);
        gl_FragDepth = clamp((uDepth.x + uDepth.y/depth)*.5+.5,0.0,1.0);
        break;
      }
      if (r > 5.54 && dot(p,ray) > 0.0) break;
      float dt = min(.30,.036 + r*.059);
      if (abs(p.y) < .56) disk(p,ray,dt,accum,transmit);
      float field = 1.0-smoothstep(3.55,5.54,r);
      vec3 turn = (ray * dot(p,ray)-p) * (bend*field/(r2*r));
      ray = normalize(ray + turn*dt);
      p += ray*dt;
    }
    // A thin unresolved photon ring between the shadow and the lensed disk.
    float photon = sqrt(impact) - (1.324 + (bend-.73)*.65);
    float arc = pow(.5+.5*cos(atan(screen.y,screen.x)*2.0-.66),3.0);
    accum += vec3(1.0,.43,.23) * (.027+.23*arc) * exp(-abs(photon)*93.0) * transmit;
  }
  vec3 distant = sky(ray);
  distant *= mix(1.0,.43,exp(-impact*.34));
  accum += transmit * mix(distant,vec3(.00025,.00016,.0004),captured);
  color = vec4(accum * uStorage,1.0);
}`;

const blurFragment = `#version 300 es
precision highp float;
uniform sampler2D uImage;
uniform vec2 uResolution, uDirection;
uniform float uExtract, uStorage;
out vec4 color;
vec3 sampleLight(vec2 p) {
  vec3 raw = texture(uImage,p).rgb;
  float value = max(max(raw.r,raw.g),raw.b) / uStorage;
  return raw * mix(1.0,smoothstep(.32,1.45,value),uExtract);
}
void main() {
  vec2 p = gl_FragCoord.xy/uResolution;
  vec3 c = sampleLight(p)*.227027;
  c += (sampleLight(p+uDirection*1.384615)+sampleLight(p-uDirection*1.384615))*.316216;
  c += (sampleLight(p+uDirection*3.230769)+sampleLight(p-uDirection*3.230769))*.070270;
  color = vec4(c,1.0);
}`;

const finishFragment = `#version 300 es
precision highp float;
uniform sampler2D uScene, uBloom, uHalo;
uniform vec2 uResolution;
uniform float uStorage;
out vec4 color;
float hash(vec2 p) {
  return fract(52.9829189 * fract(dot(p,vec2(.06711056,.00583715))));
}
vec3 grade(vec3 c) {
  return clamp((c*(2.51*c+.03))/(c*(2.43*c+.59)+.14), 0.0, 1.0);
}
void main() {
  vec2 p = gl_FragCoord.xy/uResolution;
  vec2 q = p * 2.0 - 1.0;
  vec3 scene = texture(uScene,p).rgb;
  vec3 bloom = texture(uBloom,p).rgb;
  vec3 halo = texture(uHalo,p).rgb;
  vec3 light = (scene + .32*bloom + .28*halo) / uStorage;
  light *= 1.0 - .31*smoothstep(.26,1.65,length(q*vec2(.77,1.0)));
  light += vec3(.00115,.00074,.00195);
  vec3 c = pow(grade(light), vec3(.4545));
  float grain = hash(gl_FragCoord.xy)-.5;
  c += grain * (.028 - .013*smoothstep(.06,.65,dot(c,vec3(.21,.71,.08))));
  color = vec4(max(c,0.0),1.0);
}`;
const particleVertex = `#version 300 es
precision highp float;
uniform mat4 uViewProjection;
uniform vec3 uEye;
uniform float uTime, uPulse, uPress, uPixelRatio;
uniform bool uStreak;
out vec3 vColor;
out float vAlpha;
float hash(float n) {
  return fract(sin(n * 78.233 + 19.31)*43758.5453123);
}
void main() {
  float i = float(uStreak ? (gl_VertexID/2) : gl_VertexID);
  float tail = float(gl_VertexID & 1);
  float seed = hash(i + 493.3);
  float structure = hash(i+18.37);
  float spread = hash(i+12.7);
  float rare = hash(i+110.0);
  float orbit = hash(i+2.2)*6.2831853;
  float r = 1.26 + pow(spread,1.58)*3.64;
  bool corona = !uStreak && seed < .17;
  if (corona) r = 2.3 + pow(spread,.76)*4.8;
  if (uStreak) r = 1.42 + pow(spread,1.4)*3.17;
  float speed = .32 * pow(1.85/r,1.35);
  float a = orbit + uTime*speed;
  float y = (hash(i+23.52)-.5) * (.074+r*.047);
  y += .07*sin(3.0*a+2.1*r);
  float crest = 1.18 - 3.2*log(max(uPulse,.018));
  float wave = uPulse*exp(-abs(r-crest)*1.2);
  y += wave*.40*cos((r-crest)*6.2 - .54*sin(3.0*a));
  r += .28*uPulse*pow(spread,.7) + .033*sin(5.0*a+i);
  if (corona) y += (seed-.09)*10.0*(.32+rare);
  if (uStreak) {
    a -= tail * (.018 + .12*pow(rare,2.0)) * (1.0+uPress*.5);
    y += (.5-hash(i+41.23))*.16 + tail*.025;
  }
  vec3 p = vec3(cos(a)*r, y, sin(a)*r);
  gl_Position = uViewProjection * vec4(p,1.0);
  float depth = distance(p,uEye);
  float large = pow(rare,22.0);
  gl_PointSize = clamp((.75 + large*2.6 + uPress*.4) * (8.1/max(2.4,depth)) * uPixelRatio, 1.0, 7.0);
  float hot = 1.0-smoothstep(1.45,4.7,r);
  vec3 warm = mix(vec3(1.85,.48,.14),vec3(1.9,1.44,1.12),pow(structure,1.9));
  vec3 cool = mix(vec3(.46,.27,.96),vec3(.67,.46,.74),structure);
  vColor = mix(cool, warm, hot);
  vAlpha = (.025 + pow(hash(i+39.43),5.0)*.36) * (.65+.54*hot);
  vAlpha *= .35+.65*pow(.5+.5*sin(3.0*orbit + 7.5*log(r)),2.0);
  vAlpha *= .54+.46*pow(.5+.5*sin(uTime*(1.2+rare*1.4)+i),1.2);
  vAlpha *= 1.0 + uPress*.8 + uPulse*.65;
  if (uStreak) vAlpha *= (1.0-tail)*.97;
  else if (corona) vAlpha *= .60;
  else vAlpha *= .75 + large*.58;
}`;

const particleFragment = `#version 300 es
precision highp float;
uniform bool uStreak;
uniform float uStorage;
in vec3 vColor;
in float vAlpha;
out vec4 color;
void main() {
  float shape = 1.0;
  if (!uStreak) {
    vec2 p = gl_PointCoord * 2.0 - 1.0;
    shape = max(0.0,exp(-3.9*dot(p,p))-.020);
  }
  color = vec4(vColor * (shape * vAlpha * uStorage),0.0);
}`;
function createDebris(gl, makeProgram) {
  const vertexSource = `#version 300 es
    precision highp float;
    layout(location=0) in vec3 aPosition;
    layout(location=1) in vec4 aOrbit;
    layout(location=2) in vec4 aShape;
    layout(location=3) in vec4 aSpin;

    uniform mat4 uViewProjection;
    uniform float uTime, uPulse, uPress;
    out vec3 vWorld, vLocal;
    flat out float vSeed, vFace, vScale;

    vec3 turn(vec3 p, vec3 axis, float angle) {
      float s = sin(angle), c = cos(angle);
      return p*c + cross(axis,p)*s + axis*dot(axis,p)*(1.0-c);
    }

    void main() {
      float radius = aOrbit.x;
      float direction = aOrbit.y + uTime * aOrbit.z + .13*uPress/radius;
      float c = cos(direction), s = sin(direction);
      vec3 radial = vec3(c,0,s);
      vec3 tangent = vec3(-s,0,c);
      float swelling = uPulse * (.18 + .19*cos(direction*3.0+aSpin.w*9.0));
      float height = aOrbit.w * sin(direction + aSpin.w*6.2832);
      height += swelling * aOrbit.w * .95;
      radius += swelling - .21*uPress * min(1.0, radius/2.6);
      vec3 center = radial*radius + vec3(0,height,0);
      center.z *= aShape.w;

      vec3 form = aPosition * vec3(aShape.y, aShape.z, 1.0);
      vec3 stone = turn(form, aSpin.xyz, aSpin.w*12.6 + uTime*.29 + uPulse*.85);
      vec3 oriented = stone.x*radial + stone.y*tangent - vec3(0,stone.z,0);
      vWorld = center + oriented*aShape.x;
      vLocal = aPosition;
      vSeed = aSpin.w;
      vFace = float(gl_VertexID / 3);
      vScale = aShape.x;
      gl_Position = uViewProjection * vec4(vWorld,1);
    }
  `;

  const fragmentSource = `#version 300 es
    precision highp float;
    uniform vec3 uEye;
    uniform float uStorageScale;
    in vec3 vWorld, vLocal;
    flat in float vSeed, vFace, vScale;
    out vec4 outColor;

canvas.addEventListener("pointerup", event => stopDrag(event,true));
canvas.addEventListener("pointercancel", event => stopDrag(event,false));
canvas.addEventListener("lostpointercapture", event => stopDrag(event,false));
canvas.addEventListener("pointerleave", () => { hoverX = 0; hoverY = 0; requestFrame(); });
function zoom(delta) {
  aim.radius = clamp(aim.radius*Math.exp(delta),4.65,16.5);
  requestFrame();
}
let gestureScale = null;
root.addEventListener("wheel", event => {
  if (event.deltaY === 0) return;
  event.preventDefault();
  if (event.ctrlKey && gestureScale !== null) return;
  const factor = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? canvas.clientHeight : 1;
  const sensitivity = event.ctrlKey ? .008 : .0012;
  zoom(clamp(event.deltaY*factor*sensitivity,-.34,.34));
}, { passive: false });
root.addEventListener("gesturestart", event => {
  event.preventDefault();
  gestureScale = 1;
}, { passive: false });
root.addEventListener("gesturechange", event => {
  if (gestureScale === null || !Number.isFinite(event.scale) || event.scale <= 0) return;
  event.preventDefault();
  zoom(Math.log(gestureScale/event.scale));
  gestureScale = event.scale;
}, { passive: false });
root.addEventListener("gestureend", () => { gestureScale = null; });
root.querySelector('[data-tide-action="zoom-out"]').addEventListener("click", () => zoom(.18));
root.querySelector('[data-tide-action="zoom-in"]').addEventListener("click", () => zoom(-.18));
canvas.addEventListener("keydown", event => {
  switch (event.key) {
    case "ArrowLeft": aim.yaw -= .145; break;
    case "ArrowRight": aim.yaw += .145; break;
    case "ArrowUp": aim.pitch = clamp(aim.pitch+.12,-1.27,1.27); break;
    case "ArrowDown": aim.pitch = clamp(aim.pitch-.12,-1.27,1.27); break;
    case "+":
    case "=": zoom(-.13); break;
    case "-": zoom(.13); break;
    case " ": disturb(); break;
    default: return;
  }
  event.preventDefault();
  requestFrame();
});
motionButton.addEventListener("click", () => {
  running = !running;
  updateMotionLabel();
  requestFrame();
});
pulseButton.addEventListener("click", disturb);
motionPreference.addEventListener("change", event => {
  running = !event.matches;
  updateMotionLabel();
  requestFrame();
});
if (root.dataset.renderer === "webgl2") {
  canvas.addEventListener("webglcontextlost", event => {
    event.preventDefault();
    lost = true;
  });
  canvas.addEventListener("webglcontextrestored", () => {
    renderer = createWebGL(canvas);
    lost = false;
    requestFrame();
  });
}

new ResizeObserver(updateSize).observe(root);
new IntersectionObserver(entries => {
  visible = entries[0].isIntersecting;
  last = 0;
  requestFrame();
}).observe(root);
updateSize();
})();
</script>
</body>
</html>
